<script>
  const navTargets = {
    "Panel": "sayfa1.html",
    "Arşiv": "sayfa2.html",
    "Hızlı Ekle": "sayfa3.html",
    "Koç": "sayfa5.html",
    "Profil": "sayfa1.html"
  };

  document.querySelectorAll("nav a, nav button").forEach((item) => {
    const text = item.innerText.replace(/\s+/g, " ").trim();
    const targetLabel = Object.keys(navTargets).find((label) => text.includes(label));
    if (!targetLabel) return;

    if (item.tagName === "A") {
      item.setAttribute("href", navTargets[targetLabel]);
    } else {
      item.type = "button";
      item.addEventListener("click", () => {
        window.location.href = navTargets[targetLabel];
      });
    }
  });
</script>
